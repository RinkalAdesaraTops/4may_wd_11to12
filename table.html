<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h3>Table Example</h3>
    <!-- cellpadding="10" -->
    <table border="1" align="center" cellspacing="0"  bgcolor="yellowgreen" height="200px" width="300px">
        <!-- table row -->
        <tr>
            <th>No</th>
            <th colspan="3">Details</th>
            
        </tr>
        <tr align="center">
            <td rowspan="2">101</td>
            <td>Test</td>
            <td>24</td>
            <td>25600</td>
        </tr>
        <tr bgcolor="red">
            <td>sdfgsd</td>
            <td colspan="2">35</td>
            
        </tr>
    </table>
</body>
</html>
