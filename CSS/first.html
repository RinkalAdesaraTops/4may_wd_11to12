<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- internal css -->
    <style>
        /* 3 ways */
        /* tagname - selector */
        div{
            color:blue;
            background-color: burlywood;
            font-size:10px;
        }
        /* Id */
        #txt {
            color:chocolate
        }
        /* class name */
        .box{
            height: 300px;
            width: 200px;
            background-color: chartreuse;
        }
        .b1{
            color:red
        }
    </style>
</head>
<body>
    <!-- cascading style sheet -->
    <!-- 3 types of css
        1)inline 
        2)Internal
        3)External    
    -->
        <!-- inline css -->
    <h3 style="color:red;background-color:yellow;">Hello</h3>
    <hr>
    <div class="box">Lorem ipsum dolor sit amet consectetur adipisicing elit. Labore nemo nulla fuga, rem eligendi ab explicabo quos tempora cumque amet corporis asperiores soluta omnis id eos deserunt iusto consequatur voluptas?</div>
    <div id="txt">Hello</div>
    <div class="box b1">jkdfhg dkjghdfjkg</div>
    <div>dfkljhgd</div>
</body>
</html>
